[project]
name = "epub-bilingual-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# flash-attn ships a cp312-only wheel (see tool.uv.sources), so this is 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "epub-translator>=0.1.10",
    # polish_cjk.py subsets the embedded CJK face with it, and refuses to run
    # without one, so it is a plain dependency and not an extra.
    "fonttools>=4.60.1",
    "lxml>=6.1.1",
    "python-dotenv>=1.2.2",
    # 6.0.2 exactly is what paddlex pins; we only need >=6.0.
    "pyyaml>=6.0.2",
    # PDF -> EPUB OCR: PaddleOCR-VL 1.6 behind a vLLM server.
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle-gpu==3.3.1",
    "einops",
    "torch==2.8.0",
    "transformers<5.0.0",
    "uvloop",
    "vllm==0.10.2",
    "xformers",
    # No version specifier: the wheel's filename claims 2.8.3+cu12torch2.8… while
    # the metadata inside it says plain 2.8.3, so uv sees the installed copy as
    # stale and hardlinks it back into place on every `uv run` — one line of
    # noise per run, which a specifier here cannot prevent.
    "flash-attn",
]

# Paddle publishes its GPU wheels nowhere but its own index. `explicit` keeps
# every other package on PyPI. The cu130 index carries nightlies only, so we
# take the cu126 stable wheel; it runs fine against a CUDA 13.0 driver.
[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle" }
# Building flash-attn from the sdist takes hours; this is the prebuilt wheel for
# torch 2.8 / cp312 / cxx11abiTRUE. paddlex refuses to register the
# `genai_server` subcommand without flash-attn on a CUDA box, so it is not
# optional even though vLLM 0.10.2 ships its own kernels.
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

# The paddlepaddle-gpu cu126 wheel pins the CUDA 12.6 runtime wheels while torch
# 2.8.0 pins 12.8, so the two cannot be resolved together. These overrides give
# both the 12.8 set, which is the combination we have actually run: installing
# them one after the other with pip produced exactly this state, and PaddleOCR-VL
# works on it (CUDA 12 minor versions are runtime-compatible). Bumping torch
# means re-reading its pins and updating this list.
[tool.uv]
override-dependencies = [
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cufile-cu12==1.13.1.3",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-cusparselt-cu12==0.7.1",
    "nvidia-nccl-cu12==2.27.3",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvtx-cu12==12.8.90",
]


[dependency-groups]
dev = ["pytest>=8.4.2"]

# The modules sit at the repository root, so the tests import them from there.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
