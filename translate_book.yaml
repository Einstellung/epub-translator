# translate_book.yaml — 翻译配置「模板」
# 这是模板，不要直接改它。每本书复制一份到 configs/ 再改，例如：
#   cp translate_book.yaml configs/my-book.yaml
#   uv run python translate_book.py configs/my-book.yaml
# 不指定配置文件时默认读本模板（translate_book.yaml）。
# 凡是注释掉的项都会用内置默认值；API 凭据仍从 .env 读取。

# ── 必填 ──────────────────────────────────────────────
source: "input/Chip War body.epub"      # 源 EPUB 路径（示例值，复制后请替换）
# output: "output/我的书.zh-bilingual.epub"  # 不填则自动生成 output/<书名>.<语言>-bilingual.epub

# ── 翻译设置 ──────────────────────────────────────────
language: zh            # 目标语言：zh/en/ja/ko/fr/de/es
submit: append-block    # 双语形式：append-block(原文后加译文,推荐) / append-text / replace
concurrency: 16         # 并发请求数。实测 16 不限流、约 20x 加速
max_group_tokens: 2600  # 单次翻译请求的最大 token 分组

# ── 术语表（保证全书术语/人名一致）──────────────────────
glossary:
  enabled: true                 # 是否启用术语表
  # path: "output/xxx.glossary.tsv"   # 指定现成术语表；留空则按下面规则
  auto_generate: true           # path 不存在时，先自动从本书抽取生成术语表
  min_freq: 2                   # 自动生成时，词频低于此值的候选丢弃（整本书建议 2）

# ── 不翻译的内容（公式/代码/表格）──────────────────────
# 这三项都是「送进模型前换成哨兵、译完把原文原样放回去」，模型根本看不到它们，
# 所以成品里这部分和源书逐字节相同。三项默认全开，按需单独关掉。

# 公式：epub_translator 会把 <math> 转成 LaTeX 交给模型，回来时行内公式变成
# 阅读器不认的 <m:math>，行间公式（编号公式、矩阵）干脆漏成 `$$...$$` 纯文本。
mask_math: true

# 代码：提示词里写「不要翻译代码」不是保证。技术书一章就能有上千个行内 <code>，
# 模型一次手滑就把中文正文里的标识符改了名，或者把满是标签的段落重组坏。
mask_code: true

# 表格：table/tr/td/th 都不算行内元素，于是每个单元格自成一个块，
# append-block 会在每格后面追加一个译文格——3 列的表头变 6 列，阅读器排版崩掉，
# 而且纯数字、纯型号那种列翻了也没有意义。所以表格整体保持原文、不翻译。
# 注意：表题（`Table 3-1. …` 那种 <h6>/<p>）在 <table> 外面，照常翻译。
mask_table: true

# ── 前置页面（封面/书名页/版权页/题献/目录/前言/Part 分隔页）──────
# 默认自动识别并跳过，从正文第一章开始翻译；跳过的页面仍原样保留在成品里。
# 判定依据（nav landmarks / OPF guide / epub:type / 文件名 / 体量）会逐项打印，
# 跑之前先看一眼那张表就知道排了什么、为什么排。
skip_front_matter: true
# 某一页被误判成前置页面时，在这里写它的 spine id，强制翻译它：
front_matter_keep_ids: []
# 只想审计不想翻译时，可以单独跑：
#   uv run python front_matter.py "input/某本书.epub"

# ── 排除章节（spine id，不翻译这些文档）─────────────────
# 尾注、索引等翻了对双语阅读价值不大，默认排除。
# 这里写的和上面自动识别出来的前置页面会叠加。
exclude_spine_ids:
  - endnotes
  - index
  - references             # 拆出的参考文献不翻译，双语成品里原样保留
  - SS_US_adult_signup_front
  - SS_US_adult_signup_back

# ── 缓存 ──────────────────────────────────────────────
# 每本书用独立缓存目录，支持断点续传（中断后重跑会跳过已译部分）。
# 留空则自动用 .cache/<书名>
cache_path: ""

# ── 翻译风格（追加到系统提示的 <rules> 区）────────────────
# 留空用内置的“技术非虚构、重流畅、拆长句”提示。
user_prompt: ""
