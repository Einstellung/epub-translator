# vLLM backend settings for PaddleOCR-VL-1.6-0.9B on a 12 GB card.
#
# paddlex's own defaults do not fit: it passes max_num_batched_tokens=131072,
# whose encoder cache alone leaves KV cache at -0.36 GiB and the engine exits
# with "No available memory for the cache blocks". 16384 fits a page image with
# room to spare and still gives a 280k-token KV cache.
#
# gpu-memory-utilization is deliberately NOT here: vLLM reads it as a fraction
# of total VRAM and refuses to start unless that much is free, so any fixed
# value is wrong as soon as the desktop's own usage moves. pdf_to_epub.py
# measures free VRAM with nvidia-smi, reserves room for the OCR client, and
# appends the resulting value to a copy of this file.
max-model-len: 16384
max-num-batched-tokens: 16384
max-num-seqs: 4
